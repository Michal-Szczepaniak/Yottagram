# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest,
# install it to your workspace, then paste the "User OAuth Token" (xoxp-...) into Yottagram.
#
# Everyone needs their own app: a shared app would count as distributed outside
# the Marketplace and get 1 conversations.history call per minute.
display_information:
  name: Yottagram
  description: Slack on Sailfish OS through Yottagram
oauth_config:
  scopes:
    user:
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - chat:write
      - channels:write
      - groups:write
      - im:write
      - mpim:write
      - files:read
      - files:write
      - reactions:read
      - reactions:write
      - emoji:read
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
